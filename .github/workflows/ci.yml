name: CI - Calculadora

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build do Projeto
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar pacote ZIP do build
        run: |
          zip -r calculadora.zip index.html style.css script.js calculator.js

      - name: Fazer upload do artefato ZIP
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-zip
          path: calculadora.zip
          retention-days: 7

  lint:
    name: Análise de Código
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        node-version: [20, 22, 24]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar Linter
        run: npm run lint

  tests:
    name: Testes Unitários
    needs: build
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        node-version: [20, 22, 24]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Baixar artefato ZIP
        uses: actions/download-artifact@v4
        with:
          name: calculadora-zip

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

  coverage:
    name: Cobertura de Código
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        node-version: [20, 22, 24]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar cobertura
        run: npm run coverage

  security:
    name: Análise de Segurança
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar vulnerabilidades
        run: npm audit --audit-level=high

      - name: Verificar segredos expostos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarqube:
    name: Análise SonarQube
    runs-on: ubuntu-24.04
    needs: [lint, tests, coverage]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar relatório de cobertura
        run: npm run coverage

      - name: Análise com SonarQube
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build, lint, tests, coverage, security, sonarqube]
    environment:
      name: production
     