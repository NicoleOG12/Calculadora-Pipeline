<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="background">
      <span class="sparkle sparkle-1">✦</span>
      <span class="sparkle sparkle-2">✧</span>
      <span class="sparkle sparkle-3">♡</span>
      <span class="sparkle sparkle-4">✦</span>
      <span class="sparkle sparkle-5">♡</span>
    </div>

    <div class="calculator">
      <div class="calculator-header">
        <div>
          <span class="subtitle">MY</span>
          <h1>Calculator</h1>
        </div>

        <span class="header-sparkle">✦</span>
      </div>

      <div class="display">
        <div class="display-top">
          <span id="expression"></span>
          <span class="display-label">RESULT</span>
        </div>

        <span id="result">0</span>
      </div>

      <div class="buttons">
        <button class="btn btn-clear" onclick="clearAll()">C</button>
        <button class="btn btn-operator" onclick="deleteLast()">⌫</button>
        <button class="btn btn-operator" onclick="appendOperator('%')">%</button>
        <button class="btn btn-operator" onclick="appendOperator('/')">÷</button>

        <button class="btn" onclick="appendNumber('7')">7</button>
        <button class="btn" onclick="appendNumber('8')">8</button>
        <button class="btn" onclick="appendNumber('9')">9</button>
        <button class="btn btn-operator" onclick="appendOperator('*')">×</button>

        <button class="btn" onclick="appendNumber('4')">4</button>
        <button class="btn" onclick="appendNumber('5')">5</button>
        <button class="btn" onclick="appendNumber('6')">6</button>
        <button class="btn btn-operator" onclick="appendOperator('-')">−</button>

        <button class="btn" onclick="appendNumber('1')">1</button>
        <button class="btn" onclick="appendNumber('2')">2</button>
        <button class="btn" onclick="appendNumber('3')">3</button>
        <button class="btn btn-operator" onclick="appendOperator('+')">+</button>

        <button class="btn btn-zero" onclick="appendNumber('0')">0</button>
        <button class="btn" onclick="appendDecimal()">.</button>
        <button class="btn btn-equals" onclick="calculate()">=</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
